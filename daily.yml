name: Codzienny skan przetargów
on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 06:00/07:00 w Polsce
  workflow_dispatch: {}       # ręczne uruchomienie z zakładki Actions
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Skan BZP + TED
        run: python tenders.py
        env:
          RADIUS_KM: "500"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
      - name: Zapisz wyniki
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Aktualizacja $(date -u +%F)"
          git push
